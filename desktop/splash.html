<!doctype html>
<html lang="fr" data-atelier-app="tresorerie">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'" />
    <title>Atelier Trésorerie</title>
    <!-- Mêmes jetons que l'interface (charte v2 « Linear ») ; thème du système (Système / Clair / Sombre) -->
    <script src="../static/brand/atelier-theme.js"></script>
    <link rel="stylesheet" href="../static/brand/atelier-brand.css" />
    <link rel="stylesheet" href="../static/css/app.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--canvas);
        color: var(--ink);
        font: 13px/1.45 var(--atelier-font);
        font-feature-settings: "cv11", "ss03";
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
      }
      main {
        text-align: center;
      }
      .atelier-brand__tile {
        width: 56px;
        height: 56px;
        margin: 0 auto;
        border-radius: 14px;
      }
      .atelier-brand__tile svg {
        width: 30px;
        height: 30px;
        stroke-width: 1.9;
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.012em;
      }
      p {
        margin: 0;
        color: var(--muted);
        min-height: 1.5em;
      }
      .bar {
        width: 140px;
        height: 3px;
        margin: 18px auto 0;
        border-radius: 3px;
        background: var(--raised);
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--brand);
        animation: slide 1.1s ease-in-out infinite;
      }
      small {
        display: block;
        margin-top: 14px;
        font-size: 12px;
        color: var(--faint);
      }
      @keyframes slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar span { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="atelier-brand__tile" aria-hidden="true"
        ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
          <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" /></svg
      ></span>
      <h1><span class="atelier-brand__prefix">Atelier </span>Trésorerie</h1>
      <p id="status" role="status">Démarrage…</p>
      <div class="bar" aria-hidden="true"><span></span></div>
      <small id="hint"></small>
    </main>
    <script>
      window.setStatus = (text, hint) => {
        document.getElementById('status').textContent = text
        document.getElementById('hint').textContent = hint || ''
      }
    </script>
  </body>
</html>
